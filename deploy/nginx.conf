# stackwalk behind nginx at https://<host>/stackwalk/ (as on vadim.rs). The server does no
# per-client limiting and has no header timeouts: both are done here.

# --- in http {} ---
# compiles per client address: a burst of edits passes, a script hammering the API gets 429
limit_req_zone $binary_remote_addr zone=stackwalk_api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=stackwalk_conn:10m;
# slow clients (slowloris): nginx defaults are 60 s; set them in http {} or server {}
# client_header_timeout 10s;
# client_body_timeout 10s;

# --- in the server {} of the site ---
# the page loads its files and the API by relative paths: it must be opened with the slash
location = /stackwalk { return 301 /stackwalk/; }

location /stackwalk/ {
    # the trailing slash strips /stackwalk: the server sees /, /app.js, /api/ping
    proxy_pass http://127.0.0.1:5173/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 10s;
    # the page's own files; API answers come compressed from the server already
    gzip on;
    gzip_types text/css text/javascript application/javascript font/ttf;
}

location = /stackwalk/api/compile {
    limit_req zone=stackwalk_api burst=10 nodelay;
    limit_req_status 429;
    limit_conn stackwalk_conn 4;
    limit_conn_status 429;
    # the server refuses over 16 KiB itself; this stops it before it is read
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:5173/api/compile;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # a compile is cut at 5 s by the server
    proxy_read_timeout 10s;
}
