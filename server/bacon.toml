# Dev server: `bacon` (in server/) runs the server and restarts it when the Rust
# code changes; the open page reloads itself once the server is back.
# Edits under web/ need no restart: the server watches them and reloads the page.
# BIND=127.0.0.1:5173,192.168.1.10:5173 bacon  - also open it from a phone.
default_job = "serve"

[jobs.serve]
command = ["cargo", "run"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
