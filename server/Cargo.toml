[package]
name = "stackwalk-server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# a site, not a crate: never to crates.io
publish = false

[dependencies]
axum = "0.8.9"
bitcoin = "0.32"
miniscript = { version = "13.2.0", features = ["compiler"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tower-livereload = "0.10.3"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
